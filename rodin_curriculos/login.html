<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área RH</title>
    <!-- Fonte Outfit do Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png?v=3">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilos específicos para a tela de login reaproveitando a estrutura do style.css */
        .login-wrapper {
            display: flex;
            height: 100vh;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
            position: relative;
            overflow: hidden;
        }

        .login-decor {
            position: absolute;
            width: 100%;
            height: 50vh;
            top: 0;
            background-color: var(--primary-orange);
            z-index: 0;
            border-bottom-left-radius: 50% 20%;
            border-bottom-right-radius: 50% 20%;
        }

        .login-container {
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 450px;
            z-index: 1;
            position: relative;
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-header .logo-colegio {
            color: var(--text-muted);
        }

        .login-header .logo-rodin {
            color: var(--primary-orange);
            font-family: 'Helvetica', 'Arial', sans-serif !important;
        }

        .login-header h1 {
            margin-top: 20px;
            font-size: 1.5rem;
            color: var(--text-main);
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 5px;
        }

        .error-message {
            background-color: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }

        .btn-login {
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-decor"></div>
        <div class="login-container">
            <div class="login-header" style="margin-bottom: 20px;">
                <img src="logo.png" alt="Colégio Rodin" style="width: 190px; height: auto; object-fit: contain; margin: -10px 0 -5px 0;">
                <p style="margin-top: 5px;">Acesso Restrito ao Painel RH</p>
            </div>

            <div class="error-message" id="error-msg">Usuário ou senha incorretos.</div>

            <form id="login-form">
                <div class="input-group">
                    <label for="username">Usuário</label>
                    <input type="text" id="username" name="username" placeholder="Digite seu usuário..." required>
                </div>

                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" placeholder="Digite sua senha..." required>
                </div>

                <button type="submit" class="btn-primary btn-login">Entrar no Dashboard</button>
            </form>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
